<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO & Identity -->
    <title>Gudang RTB — Manajemen Inventaris</title>
    <meta name="description" content="Sistem manajemen inventaris real-time untuk panitia RTB. Mudah, cepat, dan terpantau." />

    <!-- Favicon placeholder -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body>
    <!--
      Ini adalah "pintu masuk" HTML untuk React.
      React akan me-render seluruh aplikasi di dalam div#root ini.
      Setelah React berjalan, isi div ini akan dikendalikan sepenuhnya oleh JavaScript.
    -->
    <div id="root"></div>

    <!--
      type="module" memberitahu browser ini adalah ES Module (bukan script biasa).
      Vite akan mem-proses /src/main.jsx dan semua import-nya.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
